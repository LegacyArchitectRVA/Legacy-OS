name: LegacyOS Database Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.116.0

      - name: Start local database
        run: supabase start -x studio,imgproxy,edge-runtime,vector,logflare

      - name: Lint database
        run: supabase db lint

      - name: Run pgTAP database tests
        run: supabase test db
