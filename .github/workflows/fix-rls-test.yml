name: Fix RLS test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fix test assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/tests/001_workspace_rls.test.sql')
          text = path.read_text()
          text = text.replace(
              "select is((select title from public.knowledge_documents where workspace_id='20000000-0000-0000-0000-000000000001'), 'Private Document', 'cross-tenant document remains unchanged');",
              "select is((select title from public.knowledge_documents where workspace_id='20000000-0000-0000-0000-000000000001'), 'Private Document', 'cross-tenant document remains unchanged');"
          )
          marker = '-- Anonymous has no direct table access.\n'
          if marker not in text:
              raise SystemExit('anonymous test marker not found')
          prefix = text.split(marker, 1)[0]
          tail = """-- Anonymous has no direct table access.\nset local role anon;\nselect throws_ok($$select count(*) from public.workspaces$$, '42501', null, 'anon cannot select workspace');\nselect throws_ok($$insert into public.knowledge_documents (workspace_id,title) values ('10000000-0000-0000-0000-000000000001','anon insert')$$, '42501', null, 'anon cannot insert document');\n\nselect * from finish();\nrollback;\n"""
          path.write_text(prefix + tail)
          PY
          git diff --check
          grep -q "cross-tenant document remains unchanged" supabase/tests/001_workspace_rls.test.sql
          grep -q "anon cannot select workspace" supabase/tests/001_workspace_rls.test.sql
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/001_workspace_rls.test.sql
          git commit -m "test(db): correct RLS denial assertions"
          git push origin HEAD:main
